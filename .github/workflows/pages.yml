name: Pages

# Publishes the app on GitHub Pages, from the default branch only.
#
# One-time setup:
#   1. Settings → Pages → Source: GitHub Actions.
#   2. Deploy the proxy (GitHub Pages only serves files): `npx wrangler deploy`,
#      with CORS_ORIGIN in wrangler.toml set to your Pages origin.
#   3. Settings → Secrets and variables → Actions → Variables: PROXY_URL = the
#      address of that proxy. It is built into the app as the default proxy address.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # The variable wins when it is set; otherwise the Worker deployed from this
          # repository (name in wrangler.toml, subdomain of the Cloudflare account).
          VITE_PROXY_URL: ${{ vars.PROXY_URL || 'https://just-read-proxy.vvn47mb69j.workers.dev' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
